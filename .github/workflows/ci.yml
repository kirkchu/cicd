name: CI

on:
  push:

jobs:
  hello:
    name: Echo current time
    runs-on: ubuntu-latest
    steps:
      - name: Echo current time
        run: echo "$(date)"
      - name: Create remote directory
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MYNX }}
          SSH_KNOWN_HOSTS: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github2nx
          chmod 600 ~/.ssh/github2nx
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/github2nx \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p 2221 \
            ckk@www.chainhao.com.tw \
            'mkdir -p "$HOME/tmp/cicd"'
